<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recruitment Copilot — Dashboard</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 2rem; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.subtitle { color: #9aa0a6; margin-top: 0; }
  h2 { font-size: 1.05rem; margin-top: 2.5rem; border-bottom: 1px solid #2a2d34; padding-bottom: 0.5rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #21242b; }
  th { color: #9aa0a6; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.03em; }
  tr:hover { background: #171a20; }
  .score-pos { color: #5fd97e; }
  .score-neg { color: #f2777a; }
  .empty { color: #6b7079; font-style: italic; padding: 1rem 0; }
  .note { color: #c7cbd1; }
  .snippet { color: #9aa0a6; font-size: 0.85rem; }
  #status { font-size: 0.8rem; color: #6b7079; }
</style>
</head>
<body>
  <h1>Recruitment Copilot</h1>
  <p class="subtitle">Vista de solo lectura de lo que hizo el agente — el agente sugiere y anota, nunca decide. <span id="status"></span></p>

  <h2>Categorías (Gold)</h2>
  <table id="category-table">
    <thead>
      <tr><th>Categoría</th><th>Currículums</th><th>Palabras (prom.)</th><th>Leadership score (prom.)</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Shortlist actual</h2>
  <table id="shortlist-table">
    <thead>
      <tr><th>Résumé ID</th><th>Categoría</th><th>Nota</th><th>Agregado por</th><th>Fecha</th></tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
async function refresh() {
  const statusEl = document.getElementById("status");
  try {
    const [categories, shortlist] = await Promise.all([
      fetch("/api/category_stats").then(r => r.json()),
      fetch("/api/shortlist").then(r => r.json()),
    ]);
    renderCategories(categories);
    renderShortlist(shortlist);
    statusEl.textContent = "actualizado " + new Date().toLocaleTimeString();
  } catch (err) {
    statusEl.textContent = "error al actualizar: " + err;
  }
}

function renderCategories(rows) {
  const tbody = document.querySelector("#category-table tbody");
  tbody.innerHTML = "";
  for (const row of rows) {
    const tr = document.createElement("tr");
    const scoreClass = row.avg_leadership_score >= 0 ? "score-pos" : "score-neg";
    tr.innerHTML = `
      <td>${row.category}</td>
      <td>${row.resume_count}</td>
      <td>${row.avg_word_count}</td>
      <td class="${scoreClass}">${row.avg_leadership_score}</td>`;
    tbody.appendChild(tr);
  }
}

function renderShortlist(rows) {
  const tbody = document.querySelector("#shortlist-table tbody");
  tbody.innerHTML = "";
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Todavía no hay currículums en el shortlist.</td></tr>';
    return;
  }
  for (const row of rows) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row.resume_id}</td>
      <td>${row.category}</td>
      <td class="note">${row.note ?? ""}</td>
      <td>${row.added_by}</td>
      <td>${new Date(row.added_at).toLocaleString()}</td>`;
    tbody.appendChild(tr);
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
