command:
  - "python"
  - "app.py"

resources:
  - name: requirements
    source:
      path: ./requirements.txt

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: SQL_WAREHOUSE_ID
    value: "REPLACE_WITH_YOUR_WAREHOUSE_ID"
  - name: GOLD_CATALOG
    value: "recruitment_copilot"
  - name: VECTOR_SEARCH_INDEX
    value: "recruitment_copilot.silver.silver_resumes_index"
